[project]
name = "terawang-models"
version = "0.1.0"
description = "Model TERAWANG (K1 produksi, K2 stok, K3 harga, SPHP) sebagai fungsi pandas murni"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.11", "scikit-learn>=1.3", "sqlalchemy>=2.0", "psycopg2-binary>=2.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["terawang_models"]
