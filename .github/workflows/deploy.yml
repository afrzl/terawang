# Auto-deploy ke VPS terawang.tech setiap ada push/merge.
#   main             -> ~/terawang          (dasbor + API; hanya bagian yang berubah)
#   pipeline-dagster -> ~/terawang-pipeline (Dagster + halaman admin)
# Butuh secret repo VPS_SSH_KEY: kunci privat yang di VPS dibatasi ke ~/bin/terawang-autodeploy (lihat deploy/autodeploy-ssh.sh).
name: Deploy ke VPS

on:
  push:
    branches: [main, pipeline-dagster]
  workflow_dispatch:
    inputs:
      paksa:
        description: Jalankan semua langkah deploy walau tidak ada berkas yang berubah
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VPS_HOST: 148.230.96.97
      VPS_USER: claude
      CABANG: ${{ github.ref_name }}
      PAKSA: ${{ inputs.paksa && 'paksa' || '' }}
    steps:
      - name: Siapkan kunci SSH
        env:
          KUNCI: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$KUNCI" ]; then echo "::error::Secret VPS_SSH_KEY belum diisi"; exit 1; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KUNCI" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "$VPS_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPlFxvvdXElvgnQhpF3HS/hiaVnkBRXpjVh8iVINH5mF" > ~/.ssh/known_hosts

      - name: Deploy ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              "$VPS_USER@$VPS_HOST" "$CABANG $PAKSA"

      - name: Cek situs
        if: github.ref_name == 'main'
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS -o /dev/null https://terawang.tech/ && { echo "terawang.tech OK"; exit 0; }
            sleep 5
          done
          echo "::error::https://terawang.tech tidak menjawab"; exit 1
