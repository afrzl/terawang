# Bot WhatsApp TERAWANG. GoWA berjalan terpisah (~/terawang-wa) di network "proxy".
services:
  bot:
    build: .
    image: terawang-bot:latest
    container_name: terawang-bot
    restart: unless-stopped
    env_file: .env
    networks: [proxy, db]
    # tanpa publish port: GoWA memanggil http://terawang-bot:8080/webhook/wa lewat network proxy

networks:
  proxy:
    external: true
  db:
    external: true
